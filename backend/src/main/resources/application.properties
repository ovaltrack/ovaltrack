spring.application.name=ovaltrack-backend

# Configuración de correo. Se importa acá (y no con @PropertySource) para que
# ovaltrack.mail.provider exista antes de evaluar los @ConditionalOnProperty de los transportes.
spring.config.import=classpath:email.properties

# Database (lee las variables del entorno inyectadas por Docker o usa localhost como fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ovaltrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:APP}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:APP}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Carga las relaciones LAZY de a lotes (IN (...)) en vez de una consulta por entidad (N+1 de nómina, rivales, tipos).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# DevTools (mantiene tu configuración de hot-reload y polling)
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Web / MVC (manejo de errores de rutas no encontradas)
# spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Habilitar CORS específicamente para los endpoints de Actuator
management.endpoints.web.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

# Clave HMAC-SHA256 (mínimo 256 bits / 32 caracteres)
security.jwt.secret-key=clave_secreta_super_segura_para_ovaltrack_2026_jwt_token_super_segura
# Tiempo de expiración en milisegundos (24 horas: 86400000)
security.jwt.expiration-time=86400000




