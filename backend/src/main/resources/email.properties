# Variables para servicios de email

# Proveedor de envío: brevo (API HTTP, por defecto) o log (no envía, solo loguea; para desarrollo y CI)
ovaltrack.mail.provider=${MAIL_PROVIDER:brevo}
ovaltrack.mail.from-address=${MAIL_FROM_ADDRESS:}
ovaltrack.mail.from-name=${MAIL_FROM_NAME:OvalTrack}
ovaltrack.mail.connect-timeout=5s
ovaltrack.mail.read-timeout=10s

# Brevo: obligatorias con provider=brevo
ovaltrack.mail.brevo.api-key=${BREVO_API_KEY:}
ovaltrack.mail.brevo.base-url=https://api.brevo.com/v3

# URL pública del frontend: los enlaces de los correos apuntan acá (en producción, la URL desplegada)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
invitation.url=${app.frontend-url}/invitation
password-reset.url=${app.frontend-url}/auth/reset-password
