# Variables para servicios de email

# Proveedor de envío: smtp (desarrollo), brevo (producción, API HTTP) o log (solo loguea)
ovaltrack.mail.provider=${MAIL_PROVIDER:smtp}
ovaltrack.mail.from-address=${MAIL_FROM_ADDRESS:}
ovaltrack.mail.from-name=${MAIL_FROM_NAME:OvalTrack}
ovaltrack.mail.connect-timeout=5s
ovaltrack.mail.read-timeout=10s

# SMTP: solo se usan con provider=smtp (vacías por defecto para que el resto arranque sin ellas)
email.username=${EMAIL_USERNAME:}
email.password=${EMAIL_PASSWORD:}

# Brevo: solo se usan con provider=brevo
ovaltrack.mail.brevo.api-key=${BREVO_API_KEY:}
ovaltrack.mail.brevo.base-url=https://api.brevo.com/v3

invitation.url=http://localhost:4200/invitation
password-reset.url=http://localhost:4200/auth/reset-password
