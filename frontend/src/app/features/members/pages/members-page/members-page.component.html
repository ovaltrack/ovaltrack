<div class="layout-container page members-page">
  <header class="hud">
    <div class="hud-text hud-text--fluid">
      <p class="label-mono hud-label">Comunidad & Staff</p>
      <h1 class="hud-title">Miembros</h1>
      <p class="hud-subtitle">
        {{ canManageAccounts() ? 'Cuentas del club e invitaciones a jugadores.' : 'Jugadores de tus divisiones e invitaciones.' }}
      </p>
    </div>
  </header>

  @if (canManageAccounts()) {
    <nav class="mp-tabs" aria-label="Secciones de Miembros">
      <button type="button" class="mp-tab" [class.is-active]="tab() === 'cuentas'" [attr.aria-current]="tab() === 'cuentas' ? 'page' : null"
        (click)="select('cuentas')">
        <i class="bi bi-person-badge" aria-hidden="true"></i> Cuentas
      </button>
      <button type="button" class="mp-tab" [class.is-active]="tab() === 'jugadores'" [attr.aria-current]="tab() === 'jugadores' ? 'page' : null"
        (click)="select('jugadores')">
        <i class="bi bi-envelope-paper" aria-hidden="true"></i> Jugadores e invitaciones
      </button>
    </nav>
  }

  @if (tab() === 'cuentas') {
    <app-members-list />
  } @else {
    <app-players-invitations />
  }
</div>
