<main class="layout-container page">
  <app-home-hud [label]="store.hudLabel()" [title]="store.hudTitle()" [subtitle]="store.hudSubtitle()" />

  @switch (boardStatus()) {
    @case ('loading') {
      <div class="board-skeleton sk" aria-hidden="true"></div>
    }
    @case ('error') {
      <section class="tile board-error" role="alert">
        <p>No pudimos cargar tu último partido.</p>
        <button type="button" class="btn btn-outline" (click)="store.reload()">Reintentar</button>
      </section>
    }
    @default {
      <app-home-board [model]="store.board()" [primary]="store.primary()" [online]="store.online()" [now]="store.now()" />
    }
  }

  <div class="grid">
    <app-season-card class="s12" [state]="store.seasonKpisState()" [label]="store.seasonLabel()" [year]="store.now().getFullYear()"
                     [provisional]="store.seasonProvisional()" (retry)="store.reload()" />
    <app-squad-comparison-card class="s7" [state]="store.comparisonState()" (retry)="store.reload()" />
  </div>
</main>
