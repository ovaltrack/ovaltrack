<main class="layout-container page">
  <app-home-hud [refreshing]="store.refreshing()" [label]="store.hudLabel()" [title]="store.hudTitle()" [subtitle]="store.hudSubtitle()">
    <div hudActions class="hud-actions">
      <a class="btn btn-outline hud-btn" routerLink="/match-selection"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo partido</a>
    </div>
  </app-home-hud>

  @switch (store.boardStatus()) {
    @case ('loading') {
      <div class="board-skeleton sk" aria-hidden="true"></div>
    }
    @case ('error') {
      <section class="tile board-error" role="alert">
        <p>No pudimos cargar los partidos del club.</p>
        <button type="button" class="btn btn-outline" (click)="store.retry('matches')">Reintentar</button>
      </section>
    }
    @default {
      <app-home-board data-tour="home-board" [model]="store.board()" [primary]="store.primary()" [online]="store.online()" [now]="store.now()" />
    }
  }

  @if (divisionCount() > 0) {
    <div class="grid">
      <app-home-kpi-row class="s12" [state]="store.kpisState()" [seasonYear]="seasonYear()" (retry)="store.retry('divisions')" />

      <app-division-status-table class="s12" [state]="store.statusState()" [online]="store.online()" (retry)="store.retry('divisions')" />
    </div>
  }
</main>
