<app-home-tile [label]="label()" title="Tus tackles" [state]="state()" (retry)="retry.emit()">
  @if (columns(); as columns) {
    <div class="tackles-chart" role="img" [attr.aria-label]="columns.ariaLabel">
      <app-stat-columns [chart]="columns.chart" aria-hidden="true" />
    </div>
    <p class="tackles-foot">
      Promedio <span class="tackles-num">{{ columns.foot.average }}</span> por partido
      @if (columns.foot.squad; as squad) {
        · el plantel hace <span class="tackles-num">{{ squad }}</span>
      }
    </p>
  }
  <p tileEmpty>Todavía no hay tackles para mostrar.</p>
</app-home-tile>
