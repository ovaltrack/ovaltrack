<div class="carousel" aria-roledescription="carrusel" aria-label="Pantallas de OvalTrack">
  <div class="stage">
    <div
      #scene
      class="scene"
      tabindex="0"
      aria-label="Pantallas: arrastrá o usá las flechas del teclado para girar el cubo"
      [class.scene--dragging]="dragging()"
      (keydown)="onKeydown($event)"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
    >
      <div class="cube" [style.transform]="cubeTransform()">
        @for (screen of screens(); track screen.id; let i = $index) {
          <article
            class="face"
            role="group"
            aria-roledescription="diapositiva"
            [attr.aria-label]="(i + 1) + ' de ' + screens().length + ': ' + screen.tab"
            [class.face--visible]="faces()[i].visible"
            [class.face--active]="i === activeIndex()"
            [attr.aria-hidden]="i === activeIndex() ? null : 'true'"
            [attr.inert]="i === activeIndex() ? null : ''"
            [style.transform]="faces()[i].transform"
          >
            <div class="face-media">
              <span class="face-badge">{{ screen.tab }}</span>
              <img
                class="face-image"
                [src]="screen.image + '-800.webp'"
                [attr.srcset]="screen.image + '-800.webp 800w, ' + screen.image + '-1600.webp 1600w'"
                sizes="(max-width: 768px) 92vw, 720px"
                width="1600"
                height="1000"
                [alt]="screen.alt"
                draggable="false"
                decoding="async"
              />
            </div>

            <div class="face-body">
              <h3 class="face-title">{{ screen.title }}</h3>
              <p class="face-desc">{{ screen.description }}</p>
              <ul class="face-points">
                @for (point of screen.points; track point) {
                  <li><i class="bi bi-check2" aria-hidden="true"></i>{{ point }}</li>
                }
              </ul>
            </div>

            <!-- Sombra que oscurece la cara a medida que gira hacia el costado -->
            <span class="face-shade" aria-hidden="true" [style.opacity]="faces()[i].shade"></span>
          </article>
        }
      </div>
    </div>

    <!-- Flechas a los costados del cubo: solo en escritorio; en el celular se arrastra -->
    <button type="button" class="arrow arrow--prev" aria-label="Pantalla anterior" (click)="previous()">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" class="arrow arrow--next" aria-label="Pantalla siguiente" (click)="next()">
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

  <div class="dots">
    @for (screen of screens(); track screen.id; let i = $index) {
      <button
        type="button"
        class="dot"
        [class.dot--active]="i === activeIndex()"
        [attr.aria-current]="i === activeIndex() ? 'true' : null"
        [attr.aria-label]="'Ir a ' + screen.tab"
        (click)="goTo(i)"
      >
        <span class="dot-mark" aria-hidden="true"></span>
      </button>
    }
  </div>

  <p class="visually-hidden" aria-live="polite">{{ status() }}</p>
</div>
