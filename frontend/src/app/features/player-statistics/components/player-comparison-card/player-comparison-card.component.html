<section class="form-card">
  <div class="form-card-header card-head">
    <div>
      <h2 class="form-card-title"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> {{ title() }}</h2>
      @if (subtitle()) {
        <p class="form-card-subtitle">{{ subtitle() }}</p>
      }
    </div>
    <div class="summary" aria-label="Resumen de la comparación">
      <span class="summary-chip tone-good">{{ counts().good }} a favor</span>
      <span class="summary-chip tone-bad">{{ counts().bad }} a mejorar</span>
    </div>
  </div>

  <div class="form-card-body">
    <app-comparison-list [rows]="rows()" [squadLabel]="squadLabel()" />
  </div>
</section>
