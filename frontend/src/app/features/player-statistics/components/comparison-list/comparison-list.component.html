<div class="legend" aria-hidden="true">
  <span><span class="dot dot--player"></span>{{ playerLabel() }}</span>
  <span><span class="dot dot--squad" [class.neutral]="neutralSquad()"></span>{{ squadLabel() }}</span>
</div>

<ul class="metric-list">
  @for (row of rows(); track row.key) {
    <li class="metric" [attr.data-tone]="row.tone">
      <div class="metric-name">
        <span class="metric-label">{{ row.label }}</span>
        <span class="metric-hint">{{ row.hint }}</span>
      </div>

      <div class="bars" aria-hidden="true">
        <div class="bar-line">
          <span class="bar-value bar-value--player">{{ row.player }}</span>
          <div class="track"><div class="fill fill--player" [style.width.%]="row.playerWidth"></div></div>
        </div>
        <div class="bar-line">
          <span class="bar-value">{{ row.squad }}</span>
          <div class="track"><div class="fill fill--squad" [class.neutral]="neutralSquad()" [style.width.%]="row.squadWidth"></div></div>
        </div>
      </div>

      <span [class]="'verdict tone-' + row.tone">
        <i class="bi {{ row.icon }}" aria-hidden="true"></i>
        {{ row.verdictLabel }}
      </span>
      <span class="visually-hidden">{{ playerLabel() }} {{ row.player }}, {{ squadLabel() }} {{ row.squad }}.</span>
    </li>
  }
</ul>
