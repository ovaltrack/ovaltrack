<main class="layout-container page adm">
  <header class="hud adm-hud">
    <div class="hud-brand">
      <span class="badge-tech"><i class="bi bi-shield-lock" aria-hidden="true"></i> Panel de plataforma</span>
      <div class="brand-text">
        <h1 class="title">Administración de cuentas y clubes</h1>
        <p class="club">Revisá solicitudes de registro, activá cuentas y aprobá clubes con su administrador.</p>
      </div>
    </div>
    <div class="hud-actions">
      <button type="button" class="btn btn-outline adm-refresh" [disabled]="store.loading()" (click)="store.loadAll()">
        <i class="bi bi-arrow-clockwise" [class.adm-spin]="store.loading()" aria-hidden="true"></i>
        Actualizar
      </button>
    </div>
  </header>

  <app-admin-kpis [stats]="store.stats()" />
  <app-admin-requests-table />
  <app-admin-pending-clubs-table />
  <app-admin-accounts-table />
  <app-admin-clubs-table />
</main>

@if (store.confirmRequest(); as request) {
  <app-admin-confirm-dialog [request]="request" (confirmed)="store.acceptConfirm()" (cancelled)="store.cancelConfirm()" />
}

@if (store.changingClub(); as club) {
  <app-admin-change-admin-dialog [club]="club" />
}
