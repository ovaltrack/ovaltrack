info:
  name: 10 - [200 OK] Cobertura de analisis de partidos cerrados
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/event/coverage?matchIds={{matchFinishedPuertoMadrynId}},{{matchFinishedPortuguesId}}"
  headers:
    - name: Authorization
      value: Bearer {{coachToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con totalEvents, withoutPlayer y percent por partido", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an('array');
          res.getBody().forEach(function(coverage) {
            expect(coverage).to.have.all.keys('matchId', 'totalEvents', 'withoutPlayer', 'percent');
            expect(coverage.percent).to.be.within(0, 100);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
